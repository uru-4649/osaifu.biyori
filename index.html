<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#588c79"><title>おさいふ日和</title><link rel="manifest" href="manifest.webmanifest">
<style>
:root{--accent:#588c79;--bg:#f5f7f5;--text:#24332e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:var(--text)}header{background:var(--accent);color:white;padding:22px 18px 16px}h1{font-size:23px;margin:0}header small{opacity:.9}main{max-width:740px;margin:auto;padding:15px 13px 90px}.card{background:white;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #0000000b}.wallet{display:flex;align-items:center;justify-content:space-between;cursor:pointer;border-left:6px solid var(--c)}.wallet strong{font-size:19px}.muted{color:#6b7771;font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.btn{border:0;border-radius:11px;padding:11px 14px;background:#e8eeea;color:#24332e;font-size:15px;cursor:pointer}.primary{background:var(--accent);color:white}.blue{background:#e5f1ff;color:#1761ae}.red{background:#ffebec;color:#b33343}.small{font-size:13px;padding:7px 9px}.full{width:100%}input,select,textarea{width:100%;padding:12px;border:1px solid #d6dfd9;border-radius:10px;font:inherit;background:white;color:#24332e}label{display:block;font-size:13px;color:#53665a;margin:12px 0 5px}.hidden{display:none!important}h2{font-size:19px;margin:5px 0 14px}.amount{font-size:28px;font-weight:700;margin:8px 0 15px}table{border-collapse:collapse;width:100%;font-size:12px;table-layout:fixed}th,td{padding:9px 4px;border-bottom:1px solid #e9eeeb;overflow-wrap:anywhere}th{text-align:left;color:#68786e;font-weight:500}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td.in{color:#1768bd}td.out{color:#c43848}td.tap{cursor:pointer}td small{display:block;color:#7b8980;font-size:10px}.scroll{overflow-x:auto}nav{display:flex;gap:6px;margin-bottom:14px}nav button{flex:1}.selected{outline:2px solid var(--accent)}.spacer{height:8px}.hint{font-size:12px;color:#697b70;line-height:1.7}.danger{color:#ba3545}.pill{border-radius:20px;background:#eef3f0;padding:5px 10px;font-size:12px}dialog{border:0;border-radius:18px;width:min(95vw,520px);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 8px 40px #0003}dialog::backdrop{background:#15281b80}.actions{display:flex;gap:8px;margin-top:18px}.actions button{flex:1}.month{font-size:18px;font-weight:700}.category-row{border-bottom:1px solid #edf1ee;padding:12px 2px;cursor:pointer}.money{font-variant-numeric:tabular-nums}.topspace{margin-top:12px}
</style></head><body>
<header><h1>🌷 おさいふ日和</h1><small>わたしのお金を、わかりやすく。</small></header>
<main>
<nav><button class="btn selected" data-tab="home" onclick="tab('home')">お財布</button><button class="btn" data-tab="summary" onclick="tab('summary')">月別集計</button><button class="btn" data-tab="settings" onclick="tab('settings')">設定</button></nav>
<section id="home"></section><section id="detail" class="hidden"></section><section id="summary" class="hidden"></section><section id="settings" class="hidden"></section>
</main>
<dialog id="modal"><div id="modalBody"></div></dialog>
<script>
const KEY='osaihu_biyori_v1';const fmt=n=>Math.round(n||0).toLocaleString('ja-JP');const today=()=>new Date().toLocaleDateString('sv-SE');const id=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const ym=d=>d.slice(0,7);const addDays=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv-SE')};
let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{};if(!db||!Array.isArray(db.wallets))db={wallets:[],categories:[],entries:[],sort:'new',theme:'#588c79',auto:{enabled:false,amount:30000,start:'',wallet:''}};
db.categories??=[];db.entries??=[];db.auto??={enabled:false,amount:30000,start:'',wallet:''};let active=null,month=ym(today()),sumMonth=ym(today()),searchMode=false;
function save(){localStorage.setItem(KEY,JSON.stringify(db));document.documentElement.style.setProperty('--accent',db.theme||'#588c79')}
function balance(w){return (Number(w.initial)||0)+db.entries.filter(e=>e.wallet===w.id).reduce((a,e)=>a+Number(e.amount),0)}
function entrySort(a,b){let n=a.date.localeCompare(b.date)||a.created-b.created;return db.sort==='new'?-n:n}
function applyAuto(){let a=db.auto;if(!a.enabled||!a.start||!a.wallet||!db.wallets.some(w=>w.id===a.wallet))return;let d=a.start;let dow=new Date(d+'T12:00:00').getDay();d=addDays(d,(6-dow+7)%7);let changed=false,count=0;while(d<=today()&&count++<1500){let key='auto:'+a.wallet+':'+d;if(!db.entries.some(e=>e.autoKey===key)){db.entries.push({id:id(),wallet:a.wallet,date:d,content:'家計補充',amount:Number(a.amount)||30000,category:'',memo:'',created:Date.now(),autoKey:key});changed=true}d=addDays(d,7)}if(changed)save()}
function tab(t){active=null;['home','detail','summary','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('selected',b.dataset.tab===t));if(t==='home')renderHome();if(t==='summary')renderSummary();if(t==='settings')renderSettings()}
function renderHome(){applyAuto();document.getElementById('home').innerHTML='<div class="row between"><h2>お財布一覧</h2><button class="btn primary" onclick="walletForm()">＋ お財布</button></div>'+ (db.wallets.length?db.wallets.map((w,i)=>`<div class="card wallet" style="--c:${esc(w.color)}" onclick="openWallet('${w.id}')"><div><strong>${esc(w.icon||'💰')} ${esc(w.name)}</strong><div class="muted">通帳を見る ›</div></div><div style="text-align:right"><strong class="money">${fmt(balance(w))}</strong><div class="row" style="justify-content:end;margin-top:5px"><button class="btn small" onclick="event.stopPropagation();moveWallet('${w.id}',-1)" ${i===0?'disabled':''}>↑</button><button class="btn small" onclick="event.stopPropagation();moveWallet('${w.id}',1)" ${i===db.wallets.length-1?'disabled':''}>↓</button></div></div></div>`).join(''):'<div class="card">まずは「＋ お財布」から作成してね。家計・旅行積立・医療費など自由に追加できるよ。</div>')}
function moveWallet(wid,n){let i=db.wallets.findIndex(w=>w.id===wid),j=i+n;if(j<0||j>=db.wallets.length)return;[db.wallets[i],db.wallets[j]]=[db.wallets[j],db.wallets[i]];save();renderHome()}
function openWallet(wid){active=wid;month=ym(today());searchMode=false;['home','detail','summary','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!=='detail'));renderDetail()}
function renderDetail(){applyAuto();let w=db.wallets.find(w=>w.id===active);if(!w)return tab('home');let list=db.entries.filter(e=>e.wallet===active&&(searchMode||ym(e.date)===month)).sort(entrySort);document.getElementById('detail').innerHTML=`<button class="btn small" onclick="tab('home')">‹ お財布一覧</button><div class="card topspace"><div class="row between"><h2>${esc(w.icon)} ${esc(w.name)}</h2><button class="btn small" onclick="walletForm('${w.id}')">編集</button></div><div class="muted">現在の残高</div><div class="amount">${fmt(balance(w))}</div><div class="row"><button class="btn blue" onclick="entryForm('in')">＋ 入金</button><button class="btn red" onclick="entryForm('out')">− 出金</button><button class="btn" onclick="transferForm()">振替</button><button class="btn" onclick="adjustForm()">残高調整</button></div></div><div class="card"><div class="row between"><button class="btn small" onclick="shiftMonth(-1)">◀</button><span class="month">${esc(month.slice(0,4))}年${Number(month.slice(5))}月</span><button class="btn small" onclick="shiftMonth(1)">▶</button></div><div class="row between topspace"><button class="btn small" onclick="db.sort=db.sort==='new'?'old':'new';save();renderDetail()">並び順：${db.sort==='new'?'新しい順 ↓':'古い順 ↑'}</button><button class="btn small" onclick="searchMode=!searchMode;renderDetail()">🔍 ${searchMode?'検索を閉じる':'履歴検索'}</button></div>${searchMode?'<label>内容・メモを検索（全期間）</label><input id="searchText" placeholder="キーワード" oninput="filterRows()"><div class="hint">検索中は全期間から探します。</div>':''}<div class="scroll topspace"><table><colgroup><col style="width:17%"><col style="width:29%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup><thead><tr><th>日付</th><th>内容</th><th class="num">入金</th><th class="num">出金</th><th class="num">残高</th></tr></thead><tbody id="rows">${rowsHtml(list,w)}</tbody></table></div></div>`}
function rowsHtml(list,w){let ordered=db.entries.filter(e=>e.wallet===w.id).sort((a,b)=>a.date.localeCompare(b.date)||a.created-b.created);let running=Number(w.initial)||0;let bals={};for(let e of ordered){running+=Number(e.amount);bals[e.id]=running}return list.map(e=>`<tr class="entryRow" data-search="${esc((e.content+' '+(e.memo||'')).toLowerCase())}" onclick="entryForm('edit','${e.id}')"><td class="tap">${esc(e.date.slice(5).replace('-','/'))}</td><td class="tap">${esc(e.content)}${e.memo?'<small>'+esc(e.memo)+'</small>':''}</td><td class="num in">${e.amount>0?fmt(e.amount):''}</td><td class="num out">${e.amount<0?fmt(-e.amount):''}</td><td class="num">${fmt(bals[e.id])}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">記録はありません</td></tr>'}
function filterRows(){let q=document.getElementById('searchText').value.toLowerCase();document.querySelectorAll('.entryRow').forEach(x=>x.hidden=!x.dataset.search.includes(q))}
function shiftMonth(n){let [y,m]=month.split('-').map(Number);month=new Date(y,m-1+n,1).toLocaleDateString('sv-SE').slice(0,7);renderDetail()}
function show(s){document.getElementById('modalBody').innerHTML=s;document.getElementById('modal').showModal()}function closeModal(){document.getElementById('modal').close()}
function walletForm(wid){let w=db.wallets.find(x=>x.id===wid)||{name:'',icon:'💰',color:'#588c79',initial:0};show(`<h2>${wid?'お財布を編集':'お財布を追加'}</h2><form onsubmit="saveWallet(event,'${wid||''}')"><label>お財布の名前</label><input name="name" required maxlength="30" value="${esc(w.name)}"><label>アイコン（絵文字）</label><input name="icon" value="${esc(w.icon)}" maxlength="6"><label>色</label><input type="color" name="color" value="${esc(w.color)}"><label>初期残高</label><input type="number" name="initial" min="0" step="1" value="${w.initial}" required><div class="hint">初期残高を変更すると現在の残高も変わります。</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">戻る</button><button class="btn primary">保存</button></div></form>${wid?`<button class="btn small danger topspace" onclick="deleteWallet('${wid}')">お財布を削除</button>`:''}`)}
function saveWallet(ev,wid){ev.preventDefault();let f=ev.target.elements;let w=db.wallets.find(x=>x.id===wid);if(!w){w={id:id()};db.wallets.push(w)}Object.assign(w,{name:f.name.value.trim(),icon:f.icon.value||'💰',color:f.color.value,initial:Number(f.initial.value)});save();closeModal();active?renderDetail():renderHome()}
function deleteWallet(wid){if(db.entries.some(e=>e.wallet===wid)){alert('履歴があるお財布は削除できません。記録を守るため、先に履歴を整理してください。');return}if(!confirm('このお財布を削除しますか？'))return;db.wallets=db.wallets.filter(w=>w.id!==wid);if(db.auto.wallet===wid)db.auto.enabled=false;save();closeModal();tab('home')}
function categoryOptions(sel){return '<option value="">分類なし</option>'+db.categories.map(c=>`<option value="${c.id}" ${sel===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
function entryForm(type,eid){let e=db.entries.find(x=>x.id===eid),isEdit=!!e,kind=isEdit?(e.amount>=0?'in':'out'):type;show(`<h2>${isEdit?'記録を編集':kind==='in'?'入金':'出金'}</h2><form onsubmit="saveEntry(event,'${kind}','${eid||''}')"><label>日付</label><input type="date" name="date" required value="${esc(e?.date||today())}"><label>内容</label><input name="content" required maxlength="80" value="${esc(e?.content||'')}"><label>金額</label><input type="number" name="amount" min="1" step="1" required value="${e?Math.abs(e.amount):''}"><label>分類（任意）</label><select name="category">${categoryOptions(e?.category||'')}</select><label>メモ（任意）</label><textarea name="memo" rows="2">${esc(e?.memo||'')}</textarea><div class="actions"><button type="button" class="btn" onclick="closeModal()">戻る</button><button class="btn primary" name="submitMode" value="done">登録する</button>${!isEdit?'<button class="btn" name="submitMode" value="again">登録して続ける</button>':''}</div></form>${isEdit?`<button class="btn small danger topspace" onclick="deleteEntry('${eid}')">この記録を削除</button>`:''}`)}
function saveEntry(ev,kind,eid){ev.preventDefault();let f=ev.target.elements,amt=Number(f.amount.value)*(kind==='in'?1:-1),old=db.entries.find(e=>e.id===eid);if(kind==='out'&&balance(db.wallets.find(w=>w.id===active))-(old?old.amount:0)+amt<0&&!confirm('この記録を登録すると残高がマイナスになります。続けますか？'))return;let e=old||{id:id(),wallet:active,created:Date.now()};Object.assign(e,{date:f.date.value,content:f.content.value.trim(),amount:amt,category:f.category.value,memo:f.memo.value});if(!old)db.entries.push(e);save();let again=ev.submitter?.value==='again';closeModal();renderDetail();if(again)entryForm(kind)}
function deleteEntry(eid){let e=db.entries.find(x=>x.id===eid);if(!confirm('この記録を削除しますか？'))return;if(e.transferId){db.entries=db.entries.filter(x=>x.transferId!==e.transferId)}else db.entries=db.entries.filter(x=>x.id!==eid);save();closeModal();renderDetail()}
function transferForm(){if(db.wallets.length<2){alert('振替には2つ以上のお財布が必要です');return}show(`<h2>お財布間の振替</h2><form onsubmit="saveTransfer(event)"><label>振替元</label><select name="from">${db.wallets.map(w=>`<option value="${w.id}" ${w.id===active?'selected':''}>${esc(w.name)}</option>`).join('')}</select><label>振替先</label><select name="to">${db.wallets.map(w=>`<option value="${w.id}" ${w.id!==active?'selected':''}>${esc(w.name)}</option>`).join('')}</select><label>日付</label><input name="date" type="date" value="${today()}" required><label>金額</label><input name="amount" type="number" min="1" required><div class="actions"><button type="button" class="btn" onclick="closeModal()">戻る</button><button class="btn primary">振替する</button></div></form>`)}
function saveTransfer(ev){ev.preventDefault();let f=ev.target.elements,from=f.from.value,to=f.to.value,amt=Number(f.amount.value);if(from===to)return alert('異なるお財布を選んでください');if(balance(db.wallets.find(w=>w.id===from))<amt)return alert('振替元の残高が不足しています');let t=id(),stamp=Date.now();db.entries.push({id:id(),wallet:from,date:f.date.value,content:'振替 → '+db.wallets.find(w=>w.id===to).name,amount:-amt,category:'',memo:'',created:stamp,transferId:t},{id:id(),wallet:to,date:f.date.value,content:'振替 ← '+db.wallets.find(w=>w.id===from).name,amount:amt,category:'',memo:'',created:stamp+1,transferId:t});save();closeModal();renderDetail()}
function adjustForm(){let w=db.wallets.find(w=>w.id===active);show(`<h2>残高調整</h2><p>アプリ上の残高：<b>${fmt(balance(w))}</b></p><form onsubmit="saveAdjust(event)"><label>実際の残高</label><input type="number" name="actual" min="0" required><label>日付</label><input type="date" name="date" value="${today()}" required><div class="actions"><button type="button" class="btn" onclick="closeModal()">戻る</button><button class="btn primary">調整する</button></div></form>`)}
function saveAdjust(ev){ev.preventDefault();let f=ev.target.elements,w=db.wallets.find(w=>w.id===active),diff=Number(f.actual.value)-balance(w);if(diff)db.entries.push({id:id(),wallet:active,date:f.date.value,content:'残高調整',amount:diff,category:'',memo:'',created:Date.now()});save();closeModal();renderDetail()}
function renderSummary(){let groups={};db.entries.filter(e=>ym(e.date)===sumMonth&&e.amount<0&&!e.transferId&&e.content!=='残高調整').forEach(e=>{let k=e.category||'_none';groups[k]=(groups[k]||0)-e.amount});let prev=(()=>{let [y,m]=sumMonth.split('-').map(Number);return new Date(y,m-2,1).toLocaleDateString('sv-SE').slice(0,7)})();let keys=Object.keys(groups).sort((a,b)=>groups[b]-groups[a]);document.getElementById('summary').innerHTML=`<div class="row between"><h2>月別集計</h2><button class="btn small" onclick="categoryForm()">分類を管理</button></div><div class="card"><div class="row between"><button class="btn small" onclick="shiftSummary(-1)">◀</button><span class="month">${sumMonth.replace('-','年')}月</span><button class="btn small" onclick="shiftSummary(1)">▶</button></div><div class="hint topspace">すべてのお財布の支出を分類ごとに合算。分類をタップすると明細が開きます。</div>${keys.map(k=>{let name=db.categories.find(c=>c.id===k)?.name||'分類なし';let old=db.entries.filter(e=>ym(e.date)===prev&&e.amount<0&&e.category=== (k==='_none'?'':k)&&!e.transferId&&e.content!=='残高調整').reduce((a,e)=>a-e.amount,0);return `<div class="category-row" onclick="showCategory('${k}')"><div class="row between"><strong>${esc(name)}</strong><strong>${fmt(groups[k])} ›</strong></div><div class="muted">前月 ${fmt(old)}</div></div>`}).join('')||'<p class="muted">この月の支出はありません。</p>'}</div>`}
function shiftSummary(n){let [y,m]=sumMonth.split('-').map(Number);sumMonth=new Date(y,m-1+n,1).toLocaleDateString('sv-SE').slice(0,7);renderSummary()}
function showCategory(k){let name=db.categories.find(c=>c.id===k)?.name||'分類なし';let list=db.entries.filter(e=>ym(e.date)===sumMonth&&e.amount<0&&(e.category||'_none')===k&&!e.transferId&&e.content!=='残高調整').sort(entrySort);show(`<h2>${esc(name)}｜${esc(sumMonth)}</h2><table><thead><tr><th>日付</th><th>内容・お財布</th><th class="num">金額</th></tr></thead><tbody>${list.map(e=>`<tr><td>${esc(e.date.slice(5))}</td><td>${esc(e.content)}<small>${esc(db.wallets.find(w=>w.id===e.wallet)?.name||'')}</small></td><td class="num out">${fmt(-e.amount)}</td></tr>`).join('')}</tbody></table><p style="text-align:right"><b>合計 ${fmt(list.reduce((a,e)=>a-e.amount,0))}</b></p><button class="btn full" onclick="closeModal()">閉じる</button>`)}
function categoryForm(){show(`<h2>分類の管理</h2><div class="hint">同じ分類は、すべてのお財布の集計で合算されます。</div>${db.categories.map(c=>`<div class="row between category-row"><span>${esc(c.name)}</span><div><button class="btn small" onclick="renameCategory('${c.id}')">名前変更</button> <button class="btn small" onclick="deleteCategory('${c.id}')">削除</button></div></div>`).join('')}<form onsubmit="addCategory(event)"><label>新しい分類</label><div class="row"><input name="name" required maxlength="30" placeholder="例：外食" style="flex:1"><button class="btn primary">追加</button></div></form><button class="btn full topspace" onclick="closeModal();renderSummary()">閉じる</button>`)}
function addCategory(ev){ev.preventDefault();let name=ev.target.elements.name.value.trim();if(db.categories.some(c=>c.name===name))return alert('同じ名前の分類があります');db.categories.push({id:id(),name});save();categoryForm()}
function renameCategory(cid){let c=db.categories.find(x=>x.id===cid),name=prompt('新しい分類名',c.name)?.trim();if(!name)return;if(db.categories.some(x=>x.id!==cid&&x.name===name))return alert('同じ名前の分類があります');c.name=name;save();categoryForm()}
function deleteCategory(cid){if(!confirm('分類を削除しますか？ 過去の記録は残り、分類なしになります。'))return;db.entries.forEach(e=>{if(e.category===cid)e.category=''});db.categories=db.categories.filter(c=>c.id!==cid);save();categoryForm()}
function renderSettings(){let a=db.auto;document.getElementById('settings').innerHTML=`<h2>設定</h2><div class="card"><h2>🎨 テーマカラー</h2><input type="color" value="${esc(db.theme)}" onchange="db.theme=this.value;save()"></div><div class="card"><h2>📅 家計の自動入金</h2><form onsubmit="saveAuto(event)"><label><input style="width:auto" type="checkbox" name="enabled" ${a.enabled?'checked':''}> 毎週土曜日に自動入金する</label><label>入金先のお財布</label><select name="wallet"><option value="">選択してください</option>${db.wallets.map(w=>`<option value="${w.id}" ${a.wallet===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select><label>毎週の金額</label><input name="amount" type="number" min="1" value="${a.amount||30000}" required><label>開始日（最初の土曜日以降に適用）</label><input name="start" type="date" value="${esc(a.start||'')}"><div class="hint">設定した開始日以降の土曜日分を、アプリを開いたときに1回ずつ自動記録します。開始日を過去にすると、過去分も追加されます。既存の自動入金履歴は設定変更後も残ります。</div><button class="btn primary full topspace">設定を保存</button></form></div><div class="card"><h2>💾 バックアップ</h2><p class="hint">データはこの端末のブラウザ内に保存されます。ブラウザのデータ消去や端末故障に備えて、定期的にファイルへ保存してください。</p><button class="btn primary" onclick="backup()">バックアップを保存</button><label>バックアップから復元</label><input type="file" accept=".json,application/json" onchange="restore(event)"><p class="hint danger">復元すると現在のデータは置き換わります。</p></div><div class="card"><h2>🔒 プライバシー</h2><p class="hint">この版はアカウント不要・端末内保存です。Face IDによるアプリ独自のロックと子供向け閲覧共有は、まだ実装していません。</p></div>`}
function saveAuto(ev){ev.preventDefault();let f=ev.target.elements;if(f.enabled.checked&&(!f.wallet.value||!f.start.value))return alert('お財布と開始日を選んでください');db.auto={enabled:f.enabled.checked,wallet:f.wallet.value,start:f.start.value,amount:Number(f.amount.value)};save();applyAuto();alert('保存しました');renderSettings()}
function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='おさいふ日和_バックアップ_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function restore(ev){let file=ev.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.wallets)||!Array.isArray(data.entries)||!Array.isArray(data.categories))throw Error();if(!confirm('現在の記録をバックアップの内容で置き換えます。よろしいですか？'))return;db=data;save();tab('home');alert('復元しました')}catch{alert('正しいバックアップファイルを読み込めませんでした')}ev.target.value=''}
save();tab('home');
</script></body></html>
